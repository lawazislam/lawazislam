name: Generate contribution snake
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: lawazislam
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=e3b341&color_dots=#161b22,#4d3800,#7a5900,#bb8009,#e3b341
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
